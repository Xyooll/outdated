version: 1
experience:
  required: [id, observed_at, context, action, outcome]
  fields:
    id: stable identifier
    observed_at: ISO-8601
    context: relevant state and environment snapshot
    perception_refs: source/event identifiers
    hypothesis: belief being tested or acted upon
    decision: selected action or conclusion
    action: what the system actually did
    outcome: observed result
    expected_outcome: prior expectation
    delta: expected vs actual
    metrics: quantitative measurements
    errors: failures or anomalies
    lessons: extracted reusable knowledge
    confidence: 0.0-1.0
    provenance: evidence references
    strategy_version: version that produced the experience
    node_id: geographic/runtime node
    created_at: ISO-8601
