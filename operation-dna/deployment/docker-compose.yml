services:
  dna:
    build:
      context: ../..
      dockerfile: operation-dna/deployment/Dockerfile
    environment:
      DNA_NODE_ID: ${DNA_NODE_ID:-local}
      DNA_ENV: ${DNA_ENV:-development}
      DNA_DB_PATH: /app/data/operation-dna.sqlite
      DNA_AUDIT_PATH: /app/data/audit.jsonl
      DNA_RSS_TIMEOUT: ${DNA_RSS_TIMEOUT:-20}
      DNA_POLL_INTERVAL: ${DNA_POLL_INTERVAL:-900}
    volumes:
      - dna-data:/app/data

volumes:
  dna-data:
