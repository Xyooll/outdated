name: Xyool Test Suite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q operation-dna/software operation-dna/operation_dna
      - name: Run unit and integration tests
        env:
          PYTHONPATH: operation-dna
        run: python -m unittest discover -s operation-dna/tests -p 'test_*.py' -v
