name: Research Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: research-pipeline
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run research tests
        env:
          PYTHONPATH: operation-dna
        run: python -m unittest discover -s operation-dna/tests -p 'test_*.py' -v
      - name: Run live research when feeds are configured
        if: ${{ secrets.XYOO_FEEDS != '' }}
        env:
          PYTHONPATH: operation-dna
          XYOOL_FEEDS: ${{ secrets.XYOO_FEEDS }}
        run: python -m operation_dna.software.research.live
      - name: Run research health check when feeds are not configured
        if: ${{ secrets.XYOO_FEEDS == '' }}
        env:
          PYTHONPATH: operation-dna
        run: python -m operation_dna.software.research.pipeline
