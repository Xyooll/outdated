name: Initialize Xyool Test APK Key

# This key is deliberately a PUBLIC, TEST-ONLY identity. Never use it for
# production or any app handling secrets from untrusted build environments.
# The workflow runs automatically once when first added. Afterwards it will
# refuse to replace the same signing identity.
on:
  push:
    paths:
      - '.github/workflows/xyool-init-test-key.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init-test-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate and preserve a reusable test certificate
        shell: bash
        run: |
          set -euo pipefail
          FILE=xyool-connect-android/signing/xyool-test-debug.p12.b64
          FINGERPRINT=xyool-connect-android/signing/xyool-test-debug.sha256
          if [ -f "$FILE" ]; then
            echo "Test signing certificate exists; refusing to rotate it."
            exit 0
          fi
          mkdir -p xyool-connect-android/signing
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "${RUNNER_TEMP}/xyool-test-debug.p12" \
            -alias xyool-test-debug \
            -keyalg RSA -keysize 2048 -sigalg SHA256withRSA \
            -validity 3650 -dname 'CN=Xyool Test Builds, O=Xyool Development, C=US' \
            -storepass xyool-test-only -keypass xyool-test-only
          base64 -w 0 "${RUNNER_TEMP}/xyool-test-debug.p12" > "$FILE"
          printf '\n' >> "$FILE"
          keytool -list -v -storetype PKCS12 \
            -keystore "${RUNNER_TEMP}/xyool-test-debug.p12" \
            -alias xyool-test-debug -storepass xyool-test-only \
            | sed -n 's/^[[:space:]]*SHA256: /SHA256: /p' > "$FINGERPRINT"
          test -s "$FINGERPRINT"
          rm -f "${RUNNER_TEMP}/xyool-test-debug.p12"
          git config user.name "Xyool Test Builds"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE" "$FINGERPRINT"
          git commit -m "Preserve fixed public test-only Android signing identity"
          git push origin HEAD:main
