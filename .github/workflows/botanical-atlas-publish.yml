name: Botanical Atlas - Publish updates
on:
  push:
    branches: [main]
    paths:
      - 'botanical-atlas/**'
      - '.github/workflows/botanical-atlas-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: botanical-atlas-publisher
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: botanical-atlas
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check research workbench JavaScript syntax
        run: node --check app/workbench.js
      - name: Test batch integrity protections
        run: python -m unittest discover -s tests -v
      - name: Automatically ingest research and regenerate catalog
        run: python tools/atlas_pipeline.py ingest
      - name: Verify Atlas integrity
        run: python tools/atlas_pipeline.py validate
      - name: Publish Atlas without manual review
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- .)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A -- .
            git commit -m 'atlas: automatically publish researched catalog [skip ci]'
            git push origin HEAD:main
          else
            echo 'Atlas is up to date.'
          fi
