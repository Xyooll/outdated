name: Build Xyool Next Side-by-Side APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'xyool-connect-android/app/**'
      - 'xyool-connect-android/signing/xyool-test-debug.p12.b64'
      - 'xyool-connect-android/signing/xyool-test-debug.sha256'
      - '.github/workflows/xyool-side-by-side-test.yml'

permissions:
  contents: read

jobs:
  next-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable public test signing key
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode xyool-connect-android/signing/xyool-test-debug.p12.b64 \
            > xyool-connect-android/signing/xyool-test-debug.p12
          keytool -list -storetype PKCS12 \
            -keystore xyool-connect-android/signing/xyool-test-debug.p12 \
            -storepass xyool-test-only -alias xyool-test-debug > /dev/null
      - name: Compile isolated Xyool Next APK
        working-directory: xyool-connect-android
        env:
          XYOOL_SIDE_BY_SIDE: 'true'
          XYOOL_DEBUG_BUILD_NUMBER: ${{ github.run_number }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify side-by-side package, certificate, and version
        shell: bash
        env:
          XYOOL_DEBUG_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APK=xyool-connect-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep '^package:'
          echo "$BADGING" | grep -F "name='org.xyool.connect.next'"
          echo "$BADGING" | grep -F "versionCode='$((1000 + XYOOL_DEBUG_BUILD_NUMBER))'"
          VERIFY=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")
          echo "$VERIFY"
          EXPECTED=$(sed -n 's/^SHA256: //p' xyool-connect-android/signing/xyool-test-debug.sha256 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          ACTUAL=$(printf '%s\n' "$VERIFY" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')
          test -n "$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"
          cp "$APK" xyool-connect-android/Xyool-Connect-Next-Update.apk
      - name: Upload independent APK that keeps old app installed
        uses: actions/upload-artifact@v4
        with:
          name: Xyool-Connect-Next-Update
          path: xyool-connect-android/Xyool-Connect-Next-Update.apk
          retention-days: 30
          if-no-files-found: error
      - name: Remove decoded test key
        if: always()
        run: rm -f xyool-connect-android/signing/xyool-test-debug.p12
