name: Operation DNA tests

on:
  push:
    paths:
      - 'operation-dna/**'
  pull_request:
    paths:
      - 'operation-dna/**'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s operation-dna/tests -p 'test_*.py' -v
