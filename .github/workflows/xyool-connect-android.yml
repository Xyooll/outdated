name: Build Xyool Connect Android

on:
  push:
    paths:
      - 'xyool-connect-android/app/**'
      - 'xyool-connect-android/tools/**'
      - 'xyool-connect-android/signing/xyool-test-debug.p12.b64'
      - 'xyool-connect-android/signing/xyool-test-debug.sha256'
      - 'xyool-connect-android/build.gradle'
      - 'xyool-connect-android/gradle.properties'
      - 'xyool-connect-android/settings.gradle'
      - '.github/workflows/xyool-connect-android.yml'
  pull_request:
    paths:
      - 'xyool-connect-android/app/**'
      - 'xyool-connect-android/build.gradle'
      - '.github/workflows/xyool-connect-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Xyool source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test bridge policy and privacy-safe ICE diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xyool-bridge-tests"
          javac -d "$RUNNER_TEMP/xyool-bridge-tests" \
            xyool-connect-android/app/src/main/java/org/xyool/connect/BridgePolicy.java \
            xyool-connect-android/app/src/main/java/org/xyool/connect/IcePathInspector.java \
            xyool-connect-android/tools/BridgeSelfTest.java
          java -cp "$RUNNER_TEMP/xyool-bridge-tests" org.xyool.connect.BridgeSelfTest
      - name: Restore ONE permanent test APK signing key
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode xyool-connect-android/signing/xyool-test-debug.p12.b64 \
            > xyool-connect-android/signing/xyool-test-debug.p12
          keytool -list -storetype PKCS12 \
            -keystore xyool-connect-android/signing/xyool-test-debug.p12 \
            -storepass xyool-test-only -alias xyool-test-debug > /dev/null
      - name: Build installable test APK (no secrets needed)
        working-directory: xyool-connect-android
        env:
          XYOOL_DEBUG_BUILD_NUMBER: ${{ github.run_number }}
          XYOOL_TARGET_ABI: arm64-v8a
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify package, increasing version and SAME signing certificate
        shell: bash
        env:
          XYOOL_DEBUG_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APK=xyool-connect-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fq "lib/arm64-v8a/libjingle_peerconnection_so.so"
          if unzip -Z1 "$APK" | grep -Eq "lib/(x86|x86_64|armeabi-v7a)/"; then
            echo "::error::Multiple CPU libraries included in ARM64 build"
            exit 1
          fi
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep '^package:'
          echo "$BADGING" | grep -F "name='org.xyool.connect.crossnetworkalpha'"
          echo "$BADGING" | grep -F "versionCode='$((1000 + XYOOL_DEBUG_BUILD_NUMBER))'"
          SIGNATURE=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")
          echo "$SIGNATURE"
          EXPECTED=$(sed -n 's/^SHA256: //p' xyool-connect-android/signing/xyool-test-debug.sha256 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          ACTUAL=$(printf '%s\n' "$SIGNATURE" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Signing key changed — refusing an update-incompatible APK."
            exit 1
          fi
          cp "$APK" xyool-connect-android/Xyool-Connect-Lite-ARM64.apk
      - name: Upload tap-to-update Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Xyool-Connect-Lite-ARM64
          path: xyool-connect-android/Xyool-Connect-Lite-ARM64.apk
          if-no-files-found: error
          retention-days: 30
      - name: Clean decoded test key
        if: always()
        run: rm -f xyool-connect-android/signing/xyool-test-debug.p12
