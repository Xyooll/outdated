name: Operation DNA Quality

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall operation-dna/software
      - name: Run tests when present
        run: |
          if [ -d tests ]; then python -m unittest discover -s tests -v; else echo 'No tests directory yet'; fi
