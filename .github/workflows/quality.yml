name: Operation DNA Quality

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall operation-dna/software operation-dna/operation_dna
      - name: Run Operation DNA tests
        env:
          PYTHONPATH: operation-dna
        run: python -m unittest discover -s operation-dna/tests -p 'test_*.py' -v
