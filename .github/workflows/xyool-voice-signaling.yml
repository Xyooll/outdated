name: Test Xyool Voice Signaling

on:
  push:
    paths:
      - 'xyool-connect-android/signaling/**'
      - '.github/workflows/xyool-voice-signaling.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-signaling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: xyool-connect-android/signaling
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned signaling dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run room isolation and signaling tests
        run: npm test
      - name: Build deployment container
        run: cd ../.. && docker build --pull -f xyool-connect-android/signaling/Dockerfile -t xyool-id-signaling:ci .
      - name: Verify Railway-style container with a persistent volume
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/xyool-calling-registry"
          docker run -d --name xyool-id-ci \
            -e PORT=18788 -e RAILWAY_ENVIRONMENT=production \
            -e RAILWAY_VOLUME_MOUNT_PATH=/data \
            -p 127.0.0.1:18788:18788 \
            -v "${RUNNER_TEMP}/xyool-calling-registry:/data" \
            xyool-id-signaling:ci
          trap 'docker logs xyool-id-ci || true; docker rm -f xyool-id-ci || true' EXIT
          for attempt in {1..15}; do
            if curl --fail --silent --show-error http://127.0.0.1:18788/health; then
              echo "Health endpoint passed with persisted volume"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy"
          exit 1
      - name: Verify missing volume is rejected
        shell: bash
        run: |
          if docker run --rm -e RAILWAY_ENVIRONMENT=production xyool-id-signaling:ci; then
            echo "ERROR: service must fail without a persistent Railway volume"
            exit 1
          else
            echo "Startup correctly refused missing volume"
          fi
