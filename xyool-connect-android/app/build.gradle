plugins {
    id 'com.android.application'
}

// Simple TEST build workflow: the test signing key is publicly recoverable
// from signing/xyool-test-debug.p12.b64. This is NOT production security.
// The GitHub Actions workflow decodes the same file for every run.
def xyoolBuildNumber = (System.getenv('XYOOL_DEBUG_BUILD_NUMBER') ?: '10').toInteger()
// Migration-safe alternative: keep a separately installable test app for
// existing users whose older APK had a different signing certificate.
// Once installed, this ID and its test signing key MUST remain unchanged.
def xyoolSideBySide = 'true'.equalsIgnoreCase(System.getenv('XYOOL_SIDE_BY_SIDE') ?: 'false')

android {
    namespace 'org.xyool.connect'
    compileSdk 35
    defaultConfig {
        // Keep this unchanged: Android considers a different ID another app.
        applicationId xyoolSideBySide ?
            'org.xyool.connect.next' : 'org.xyool.connect.crossnetworkalpha'
        manifestPlaceholders = [xyoolAppLabel: xyoolSideBySide ?
            'Xyool Connect Next' : 'Xyool QR Fix']
        minSdk 26
        targetSdk 34
        // CI run number strictly increases so later APKs upgrade earlier ones.
        // Test builds intentionally reuse the same package and signer on every CI run.
        versionCode 1000 + xyoolBuildNumber
        versionName "0.8.test.${xyoolBuildNumber}"
    }
    signingConfigs {
        xyoolTest {
            storeFile rootProject.file('signing/xyool-test-debug.p12')
            storeType 'PKCS12'
            storePassword 'xyool-test-only'
            keyAlias 'xyool-test-debug'
            keyPassword 'xyool-test-only'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.xyoolTest
        }
        release {
            // Future production releases need a different secure key.
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'io.github.webrtc-sdk:android:150.7871.01'
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
