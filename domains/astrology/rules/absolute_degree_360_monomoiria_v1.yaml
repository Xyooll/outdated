ruleset_id: ASTRO.DEGREE.ABS360.MONOMOIRIA_V1
version: 1.0.0
status: SOURCE_DOCUMENTED_HISTORICAL / EMPIRICALLY_UNVALIDATED
system_id: ASTRO.STAR.DEGREE.XYOOL_V1
purpose: assign a historical planetary degree lord to each of the 360 absolute zodiac degree cells

coordinate_contract:
  absolute_degree_exact: lambda_mod_360_in_[0,360)
  absolute_index_zero: floor(absolute_degree_exact)  # 0..359
  absolute_ordinal: absolute_index_zero + 1          # 1..360
  local_index_zero: absolute_index_zero % 30
  local_ordinal: local_index_zero + 1

method:
  family: sign_based_monomoiria
  first_degree_rule: first degree of each sign is ruled by its domicile lord
  continuation: continue one degree at a time through descending Chaldean order
  chaldean_order: [Saturn, Jupiter, Mars, Sun, Venus, Mercury, Moon]
  source_ids:
    - src.scholar.greenbaum_jones2017_monomoiria
    - src.secondary.kurent_monomoiria
    - src.ptolemy.tetrabiblos.i22_degree_rulership_witness

boundary:
  - historical use/provenance does not establish predictive efficacy
  - this is one monomoiria system; trigonal/sect variants remain separate
  - ordinal counting means 0°00'-0°59' is the first degree

